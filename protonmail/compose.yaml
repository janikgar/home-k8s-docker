services:
  protonmail:
    container_name: protonmail
    image: ghcr.io/dancwilliams/protonmail-bridge-docker:v3.27.2-4@sha256:56f586364d1f600b6c24a96b2f434412857b5d7ee81e58d304c2db8cc1cc749f 
    networks:
      - surmai_default
    ports:
      - 8143:143/tcp
      - 2525:25/tcp
    restart: always
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ./protonmail_data:/root

networks:
  surmai_default:
    external: true