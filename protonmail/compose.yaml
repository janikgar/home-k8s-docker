services:
  protonmail:
    container_name: protonmail
    image: ghcr.io/dancwilliams/protonmail-bridge-docker:v3.27.1-4@sha256:f8c193a42315e5992e1c2e93f3bc3b71f2ef6db759f688b21d1e1f01d429f77f 
    networks:
      - surmai_default
    ports:
      - 8143:143/tcp
      - 2525:25/tcp
    restart: always
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ./protonmail_data:/root

networks:
  surmai_default:
    external: true