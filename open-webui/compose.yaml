services:
  openweb-ui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09
    dns:
      - 100.100.100.100
    env_file:
      - .env
    environment:
      ENABLE_PERSISTENT_CONFIG : false
      OLLAMA_BASE_URL: http://192.168.1.241:11434
      ENABLE_OAUTH_SIGNUP: true
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: administrators
      OAUTH_ALLOWED_ROLES: '*'
      OAUTH_PROVIDER_NAME: Synology
      OPENID_PROVIDER_URL: https://syno.tailc6343.ts.net/webman/sso/.well-known/openid-configuration
      ENABLE_SIGNUP: false
      OPENAI_API_BASE_URL: https://litellm.tailc6343.ts.net/v1
      ENABLE_OLLAMA_API: false
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://192.168.1.28:8001
      DEFAULT_MODELS: lite
      MODEL_ORDER_LIST: '["lite","medium","code-lite","code-medium"]'
      DEFAULT_INTERFACE_SETTINGS: '{"textScale":"1.15"}'
      DEFAULT_MODEL_METADATA: '{"capabilities":{"web_search":true,"vision":true,"file_upload":true,"file_context":false,"image_generation":false,"code_interpreter":true,"terminal":true,"usage":true,"citations":true,"status_updates":true,"memory":true,"builtin_tools":true}}'
    ports:
      - 3000:8080
    volumes:
      - ./open-webui:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 1s
      timeout: 5s
      retries: 10

