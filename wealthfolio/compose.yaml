services:
  wealthfolio:
    ports:
      - '8088:8088'
    container_name: wealthfolio
    image: ghcr.io/wealthfolio/wealthfolio:3.13.0@sha256:9d79255f4559c736195551982218f2c911112037c47ae37224bdd1f1bc9d35df
    env_file: .env
    dns:
      - 100.100.100.100
    environment:
      WF_DB_PATH: /data/wealthfolio.db
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_CORS_ALLOW_ORIGINS: http://localhost:8088,https://wealthfolio.tailc6343.ts.net
      WF_DB_REQUIRE_ENCRYPTION: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null localhost:8088/api/v1/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/data
    restart: always

