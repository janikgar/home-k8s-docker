services:
  wealthfolio:
    ports:
      - '8088:8088'
    container_name: wealthfolio
    image: ghcr.io/wealthfolio/wealthfolio:3.11.0@sha256:2ac97bdb74f1d472f4781d1f95fdbdcd0cf612138cb80a2421282cf1788c5217 
    env_file: .env
    environment:
      WF_DB_PATH: /data/wealthfolio.db
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_CORS_ALLOW_ORIGINS: http://localhost:8088,https://wealthfolio.tailc6343.ts.net
      WF_DB_REQUIRE_ENCRYPTION: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null localhost:8088/api/v1/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data:/data
    restart: always
