services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:e6e5527fe7e4327a2d6e7cb3757b3d282520c4bed1ac7f26f88925531f88db21
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
