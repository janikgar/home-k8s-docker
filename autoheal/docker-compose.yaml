services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:eca390018df1406538181eae23166c20d1ec303558396686e03dbbbf4b3df4e4
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
