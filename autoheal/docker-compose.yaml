services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:a826bdd2ead5f6cfeadf70cffedc99f40444307442ac99cc34b5f44b26b4c907
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
