services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:2b1dcd1022b4d20016a6597eeb44a0537fe3ba2ca83ffef6f33e646167628d9c
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
