services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:6c5160b1eb691c38148e7747a582e1a7fe19f9e170107cd2f915c0edb0660f99
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
