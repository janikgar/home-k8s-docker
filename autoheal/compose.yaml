services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:d2f21ab90da18e80a1fa6e4e71ded0f631d83b4230ce28b0d66a83bd3728cf4b
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
