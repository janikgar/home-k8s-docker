services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:9f06d39d4ae9e215774b96a979007cc8e492d64d1bb9992ca035cb478b972a8a
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
