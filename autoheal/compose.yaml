services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest@sha256:2050a9dabe237a16fc3679ee446b8043f9fd59e161198bdb0ec9c10c1f48375d
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    restart: always
    network_mode: none
