services:
  hass:
    container_name: home_assistant
    image: "ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe"
    volumes:
      - /volume1/docker/hass/config:/config
      #- /usr/share/zoneinfo/America/Chicago:/etc/localtime:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: always
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 10 localhost:8123 || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 10
      start_period: 1m
